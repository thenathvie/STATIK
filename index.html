<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statik</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#10141b;--hi:#171c25;--line:#1c232d;--tx:#f3f4f6;--mu:#8a93a2;--ac:#3b82f6;--cream:#f1ede4;--g:#34d399;--r:#f87171;--f:Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--f);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font:700 20px var(--f);padding:0 6px 8px}
.logo i{width:20px;height:20px;border:2px solid var(--tx);border-radius:50%;border-top-color:var(--ac)}
.srch{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:10px;color:var(--mu)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx)}
kbd{font:11px var(--f);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
nav{display:grid;gap:2px}
nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border:0;background:none;border-radius:10px;color:var(--mu);font-weight:500;text-align:left}
nav button[aria-current]{background:var(--hi);color:var(--tx);font-weight:600}
nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;color:var(--mu);font-size:12px}
.foot b{color:var(--tx)}.foot button{background:none;border:0;padding:0;color:var(--mu);text-align:left;text-decoration:underline}
main{padding:36px 48px 80px;max-width:1240px;width:100%;margin:0 auto}
.cap,.mu{color:var(--mu)}
h1{font:700 44px/1.08 var(--f);letter-spacing:-.03em;margin:6px 0 0}h1 span{color:#6b7482}
h2{font:600 20px var(--f);letter-spacing:-.01em;margin:0 0 14px}h2 small{color:var(--mu);font:400 13px var(--f);margin-left:8px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:none;font-weight:600}
.btn.p{background:var(--cream);color:#14171c;border-color:var(--cream)}.btn.d{color:var(--r)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;color:var(--mu);font-weight:500}
.seg button[aria-pressed=true]{background:var(--hi);color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:20px}
.kpis>div{padding:18px 12px 18px 0;display:grid;gap:2px}
.kpis b{font:600 28px var(--f);letter-spacing:-.02em}
small.up{color:var(--g)}small.dn{color:var(--r)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:64px;margin-top:8px}
section{padding:26px 0;border-top:1px solid var(--line)}.cols>div>section:first-child{border-top:0}
.cols.n section:first-child{border-top:1px solid var(--line)}
svg.ch{width:100%;height:auto;display:block}svg.ch text{fill:var(--mu);font:11px var(--f)}
.leg{display:flex;gap:16px;color:var(--mu);font-size:12px;margin-bottom:6px}
.heat{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;align-items:center;font-size:12px;color:var(--mu)}
.heat span{height:30px;border-radius:6px;display:grid;place-items:center;color:var(--tx);background:var(--hi)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;flex:none}
ul.l{list-style:none;margin:0;padding:0}ul.l li{padding:8px 0;display:flex;gap:4px;align-items:baseline}
.row{display:grid;grid-template-columns:1fr auto auto;gap:18px;width:100%;align-items:center;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row small{display:block;color:var(--mu);font-size:12px}.row .m{text-align:right}
.goal{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:12px;padding:8px 0}
.trk{position:relative;height:2px;background:var(--line);margin:0 6px}.trk u{position:absolute;inset:0 auto 0 0;background:var(--ac)}
.trk em{position:absolute;top:-6px;width:8px;height:14px;margin-left:-4px;border:1.5px solid var(--ac);background:var(--bg);border-radius:3px}
.pill{border:1px solid #1f6b52;color:var(--g);border-radius:99px;padding:2px 10px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{color:var(--mu);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}tr.r{cursor:pointer}tr.r:hover{background:#0f131a}
.bar{height:6px;border-radius:3px;background:var(--hi);min-width:80px}.bar i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.set{display:grid;gap:10px;max-width:520px}.set label{display:flex;justify-content:space-between;align-items:center;gap:12px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;height:38px;padding:0 10px;min-width:0}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,94vw)}dialog::backdrop{background:#000a}
form.f{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:12px}form.f label{display:grid;gap:4px;color:var(--mu);font-size:12px}form.f .w{grid-column:1/-1}
.err{color:var(--r);min-height:1.4em;grid-column:1/-1}.acts{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end}
#auth{min-height:100vh;display:grid;place-items:center}#auth form{width:min(340px,90vw);display:grid;gap:12px}
.empty{padding:40px 0;color:var(--mu)}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px;z-index:9;background:var(--bg);border:0;border-top:1px solid var(--line)}.srch,.logo,.foot{display:none}nav{display:flex;flex:1}nav button{flex:1;flex-direction:column;gap:2px;font-size:11px;height:52px;padding:0;justify-content:center;align-items:center}main{padding:24px 18px 100px}h1{font-size:32px}.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<div id="auth" hidden>
 <form id="af"><div class="logo"><i></i>Statik</div>
  <input id="au" placeholder="Identifiant" autocomplete="username" required>
  <input id="ap" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
  <p class="err" id="ae" role="alert"></p>
  <button class="btn p">Se connecter</button><button type="button" class="btn" id="reg">Créer le compte</button>
 </form>
</div>
<div class="app" id="app" hidden>
 <aside>
  <div class="logo"><i></i>Statik</div>
  <label class="srch"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Rechercher" aria-label="Rechercher un live"><kbd>Ctrl K</kbd></label>
  <nav id="nav">
   <button data-v="dash"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>Dashboard</button>
   <button data-v="lives"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Lives</button>
   <button data-v="ana"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg>Analyses</button>
   <button data-v="data"><svg viewBox="0 0 24 24"><path d="M4 7c0-2 16-2 16 0s-16 2-16 0v10c0 2 16 2 16 0V7M4 12c0 2 16 2 16 0"/></svg>Données</button>
  </nav>
  <div class="foot"><span><b id="who"></b></span><span id="mode"></span><button id="out" hidden>Se déconnecter</button></div>
 </aside>
 <main id="main"></main>
</div>
<dialog id="dlg"><form class="f" id="f">
 <label>Plateforme<select name="p"><option value="twitch">Twitch</option><option value="tiktok">TikTok</option></select></label>
 <label>Jeu ou contenu<input name="g" maxlength="60" required></label>
 <label>Date<input name="date" type="date" required></label>
 <label>Heure de début<input name="time" type="time" required></label>
 <label>Durée (min)<input name="d" inputmode="numeric" value="90"></label>
 <label>Pic de viewers<input name="k" inputmode="numeric" value="0"></label>
 <label>Viewers moyens<input name="a" inputmode="numeric" value="0"></label>
 <label>Nouveaux abonnés<input name="s" inputmode="numeric" value="0"></label>
 <label>Revenus (€)<input name="r" inputmode="decimal" value="0"></label>
 <label>Messages du chat<input name="c" inputmode="numeric" value="0"></label>
 <label class="w">Note<input name="note" maxlength="120"></label>
 <p class="err" id="fe" role="alert"></p>
 <div class="acts"><button type="button" class="btn d" id="del" hidden>Supprimer</button><button type="button" class="btn" id="cancel">Annuler</button><button class="btn p">Enregistrer</button></div>
</form></dialog>
<input type="file" id="file" accept=".json" hidden>
<script type="module">
// Colle ici la config Firebase (projet statik-76759) pour activer comptes + Firestore. Sinon : mode local.
const CFG={name:'Nathan',firebase:null};
const P={twitch:{n:'Twitch',c:'#9146ff'},tiktok:{n:'TikTok',c:'#fe2c55'}};
const SL=['Matin','Après-midi','Soirée','Nuit'],DJ=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>(Math.round(n*10)/10).toLocaleString('fr-FR'),eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const ts=l=>new Date(l.date+'T'+l.time).getTime(),fd=d=>d.split('-').reverse().join('/'),uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dur=m=>m>=60?Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'):m+' min';
const slot=t=>{const h=+t.slice(0,2);return h>=5&&h<12?0:h>=12&&h<18?1:h>=18&&h<23?2:3},wd=d=>(new Date(d+'T12:00').getDay()+6)%7;
const dot=p=>`<i class="dot" style="background:${P[p].c}"></i>`;
let S={lives:[],goals:{twitch:{t:500,s:0},tiktok:{t:500,s:0}}},ui={v:'dash',plat:'all',per:30,sort:['date',-1],q:''},fb=null,uid_=null,ed=null,who=CFG.name;

/* Stockage : local ou Firebase */
async function save(){
  if(fb&&uid_){try{await fb.fs.setDoc(fb.fs.doc(fb.db,'users',uid_),S)}catch(e){}}
  else try{localStorage.setItem('statik-v2',JSON.stringify(S))}catch(e){}
}
const merge=d=>{if(d&&Array.isArray(d.lives))S.lives=d.lives;if(d&&d.goals)S.goals={...S.goals,...d.goals}};
async function initFb(){
  const B='https://www.gstatic.com/firebasejs/10.14.1/',[a,au,fs]=await Promise.all(['app','auth','firestore'].map(m=>import(B+'firebase-'+m+'.js')));
  const app=a.initializeApp(CFG.firebase);return{au,fs,auth:au.getAuth(app),db:fs.getFirestore(app)};
}
async function go(reg){
  const u=$('#au').value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,''),fn=reg?fb.au.createUserWithEmailAndPassword:fb.au.signInWithEmailAndPassword;
  try{if(u.length<3)throw 0;await fn(fb.auth,u+'@statik.app',$('#ap').value)}
  catch(x){$('#ae').textContent=x===0?'Identifiant : 3 caractères minimum.':'Connexion impossible. Vérifie l’identifiant et le mot de passe (6 caractères minimum).'}
}
function start(){$('#auth').hidden=true;$('#app').hidden=false;$('#who').textContent=who;$('#mode').textContent=fb?'Synchronisé avec Firestore':'Mode local : données dans ce navigateur';$('#out').hidden=!fb;render()}

/* Calculs */
const st=L=>{const n=L.length,sum=k=>L.reduce((a,l)=>a+l[k],0);return{n,h:sum('d')/60,avg:n?sum('a')/n:0,pk:Math.max(0,...L.map(l=>l.k)),sub:sum('s'),rev:sum('r')}};
const sel=off=>{const d=ui.per,now=Date.now(),D=864e5;return S.lives.filter(l=>{if(ui.plat!='all'&&l.p!=ui.plat)return false;if(!d)return !off;const t=ts(l);return off?t<=now-d*D&&t>now-2*d*D:t>now-d*D})};
const dl=(a,b)=>ui.per&&b?`<small class="${a>=b?'up':'dn'}">${a>=b?'+':'−'}${Math.abs(Math.round((a-b)/b*100))} % vs période précédente</small>`:'<small class="mu">&nbsp;</small>';
function grp(L,kf){const m={};L.forEach(l=>(m[kf(l)]=m[kf(l)]||[]).push(l));return Object.entries(m).map(([k,v])=>{const s=st(v);return{k,n:v.length,avg:s.avg,sph:s.h?s.sub/s.h:0,rph:s.h?s.rev/s.h:0,conv:s.avg?s.sub/(s.avg*s.n)*100:0}}).sort((a,b)=>b.avg-a.avg)}

/* Blocs */
const ctl=()=>`<div class="ctl"><div class="seg" role="group" aria-label="Plateforme">${[['all','Tout'],['twitch','Twitch'],['tiktok','TikTok']].map(([k,t])=>`<button data-plat="${k}" aria-pressed="${ui.plat==k}">${t}</button>`).join('')}</div><div class="seg" role="group" aria-label="Période">${[[7,'7 j'],[30,'30 j'],[90,'90 j'],[0,'Tout']].map(([k,t])=>`<button data-per="${k}" aria-pressed="${ui.per==k}">${t}</button>`).join('')}</div></div>`;
function chart(L){
  if(L.length<2)return'<p class="mu">Il faut au moins 2 lives sur la période pour tracer la courbe.</p>';
  const W=720,H=210,m=28,mx=Math.max(...L.map(l=>l.k))||1,X=i=>m+i*(W-2*m)/(L.length-1),Y=v=>H-26-v/mx*(H-46),pa=k=>L.map((l,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(l[k]).toFixed(1)).join('');
  return`<div class="leg"><span><i class="dot" style="background:var(--ac)"></i>Pic</span><span><i class="dot" style="background:var(--mu)"></i>Moyenne</span></div><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pic et moyenne de viewers par live"><g stroke="#1c232d">${[0,.5,1].map(f=>`<line x1="${m}" x2="${W-m}" y1="${Y(mx*f)}" y2="${Y(mx*f)}"/>`).join('')}</g><path d="${pa('a')}" fill="none" stroke="#8a93a2" stroke-width="2" stroke-dasharray="5 4"/><path d="${pa('k')}" fill="none" stroke="#3b82f6" stroke-width="2.5"/>${L.map((l,i)=>`<circle cx="${X(i)}" cy="${Y(l.k)}" r="4" fill="${P[l.p].c}"><title>${fd(l.date)} · ${esc(l.g)} : pic ${l.k}, moyenne ${l.a}</title></circle>`).join('')}<text x="${m}" y="${H-6}">${fd(L[0].date)}</text><text x="${W-m}" y="${H-6}" text-anchor="end">${fd(L[L.length-1].date)}</text><text x="${m}" y="${Y(mx)-6}">${mx}</text></svg>`;
}
function heat(L){
  const c=Array.from({length:28},()=>[0,0]);L.forEach(l=>{const i=wd(l.date)*4+slot(l.time);c[i][0]+=l.a;c[i][1]++});
  const mx=Math.max(1,...c.map(x=>x[1]?x[0]/x[1]:0));
  return`<div class="heat" role="img" aria-label="Viewers moyens par jour et créneau"><i></i>${SL.map(s=>`<b style="font-weight:500">${s}</b>`).join('')}${DJ.map((d,r)=>`<b style="font-weight:500">${d}</b>`+[0,1,2,3].map(s=>{const[x,n]=c[r*4+s],v=n?x/n:0;return`<span style="${n?`background:rgba(59,130,246,${(.18+.72*v/mx).toFixed(2)})`:''}" title="${n} live(s)">${n?nf(v):''}</span>`}).join('')).join('')}</div>`;
}
function watch(){
  const L=S.lives.slice().sort((a,b)=>ts(b)-ts(a)),o=[];
  if(!L.length)return'<li class="mu">Rien à surveiller pour l’instant.</li>';
  const d=Math.floor((Date.now()-ts(L[0]))/864e5);
  if(d>=5)o.push(`<li><i class="dot" style="background:var(--r)"></i><span><b>${d} jours</b> sans live.</span></li>`);
  if(L.length>=4){const g=grp(L,l=>l.g).filter(x=>x.n>=2).sort((a,b)=>b.sph-a.sph)[0],s=grp(L,l=>SL[slot(l.time)])[0];
   if(g)o.push(`<li><i class="dot" style="background:var(--g)"></i><span><b>${esc(g.k)}</b> rapporte le plus : ${nf(g.sph)} abonnés/h.</span></li>`);
   if(s)o.push(`<li><i class="dot" style="background:var(--ac)"></i><span>Meilleur créneau : <b>${s.k.toLowerCase()}</b> (${nf(s.avg)} viewers).</span></li>`)}
  return o.join('')||'<li class="mu">Aucune alerte. Continue comme ça.</li>';
}
const goal=p=>{const g=S.goals[p],c=g.s+S.lives.filter(l=>l.p==p).reduce((a,l)=>a+l.s,0),f=Math.min(100,c/g.t*100);return`<div class="goal">${'<span>'+dot(p)+P[p].n+'</span>'}<div class="trk"><u style="width:${f}%"></u><em style="left:${f}%"></em></div><span>${c}/${g.t}</span></div>`};
const liveRow=l=>`<button class="row" data-id="${l.id}"><span>${dot(l.p)}<b>${esc(l.g)}</b><small>${P[l.p].n} · ${fd(l.date)} · ${dur(l.d)}</small></span><span class="m"><b>${l.a}</b><small>viewers</small></span><span class="m"><b style="color:var(--g)">+${l.s}</b><small>abonnés</small></span></button>`;

/* Vues */
function vDash(){
  const L=sel(0).sort((a,b)=>ts(a)-ts(b)),A=st(L),B=st(sel(1)),last=S.lives.slice().sort((a,b)=>ts(b)-ts(a)).slice(0,5);
  const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const kp=[['Lives',A.n,dl(A.n,B.n)],['Temps de live',dur(Math.round(A.h*60)),dl(A.h,B.h)],['Viewers moyens',nf(A.avg),dl(A.avg,B.avg)],['Abonnés gagnés','+'+A.sub,dl(A.sub,B.sub)],['Revenus',eur(A.rev),dl(A.rev,B.rev)]];
  return`<div class="head"><div><div class="cap">${date[0].toUpperCase()+date.slice(1)}</div><h1>Bonjour ${esc(who)}.<br><span>${A.n?A.n+' live'+(A.n>1?'s':'')+' sur la période.':'Aucun live sur la période.'}</span></h1></div><button class="btn p" data-act="new">+ Nouveau live</button></div>${ctl()}
  <div class="kpis">${kp.map(k=>`<div><span class="mu">${k[0]}</span><b>${k[1]}</b>${k[2]}</div>`).join('')}</div>
  ${S.lives.length?'':'<div class="empty">Aucun live enregistré. Ajoute ton premier live, ou charge des exemples dans Données pour voir le tableau de bord.</div>'}
  <div class="cols"><div><section><h2>Viewers par live</h2>${chart(L)}</section><section><h2>Meilleurs créneaux<small>viewers moyens</small></h2>${heat(L)}</section></div>
  <div><section><h2>À surveiller</h2><ul class="l">${watch()}</ul></section><section><h2>Objectifs<small>abonnés</small></h2>${goal('twitch')}${goal('tiktok')}</section><section><h2>Derniers lives<small><a href="#" data-v="lives" style="color:var(--mu)">Tout voir</a></small></h2>${last.map(liveRow).join('')||'<p class="mu">Aucun live.</p>'}</section></div></div>`;
}
function vLives(){
  const [k,dir]=ui.sort,q=ui.q.trim().toLowerCase(),val=l=>k=='date'?ts(l):k=='p'?P[l.p].n:l[k];
  const L=S.lives.filter(l=>(ui.plat=='all'||l.p==ui.plat)&&(!q||(l.g+' '+l.note).toLowerCase().includes(q))).sort((a,b)=>{const x=val(a),y=val(b);return(typeof x=='string'?x.localeCompare(y):x-y)*dir});
  const H=[['date','Date'],['p','Plateforme'],['g','Contenu'],['d','Durée'],['k','Pic'],['a','Moyenne'],['s','Abonnés'],['r','Revenus']];
  return`<div class="head"><h1>Lives</h1><button class="btn p" data-act="new">+ Nouveau live</button></div><div class="ctl"><div class="seg" role="group" aria-label="Plateforme">${[['all','Tout'],['twitch','Twitch'],['tiktok','TikTok']].map(([a,t])=>`<button data-plat="${a}" aria-pressed="${ui.plat==a}">${t}</button>`).join('')}</div></div>
  <section style="margin-top:20px"><div class="tw"><table><thead><tr>${H.map(([a,t])=>`<th data-sort="${a}" aria-sort="${k==a?(dir>0?'ascending':'descending'):'none'}">${t}${k==a?(dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${L.map(l=>`<tr class="r" tabindex="0" data-id="${l.id}"><td>${fd(l.date)} ${l.time}</td><td>${dot(l.p)}${P[l.p].n}</td><td>${esc(l.g)}</td><td>${dur(l.d)}</td><td>${l.k}</td><td>${l.a}</td><td>+${l.s}</td><td>${eur(l.r)}</td></tr>`).join('')}</tbody></table></div>${L.length?'':'<p class="empty">Aucun live ne correspond.</p>'}</section>`;
}
function vAna(){
  const L=sel(0),mx=a=>Math.max(1,...a.map(x=>x.avg)),tab=(t,G)=>`<section><h2>${t}</h2><div class="tw"><table><thead><tr><th>${t.split(' ').pop()}</th><th>Lives</th><th>Viewers moy.</th><th></th><th>Abonnés/h</th><th>€/h</th><th>Conversion</th></tr></thead><tbody>${G.map(g=>`<tr><td>${esc(g.k)}</td><td>${g.n}</td><td>${nf(g.avg)}</td><td style="width:20%"><div class="bar"><i style="width:${g.avg/mx(G)*100}%"></i></div></td><td>${nf(g.sph)}</td><td>${nf(g.rph)}</td><td>${nf(g.conv)} /100</td></tr>`).join('')}</tbody></table></div></section>`;
  if(!L.length)return`<div class="head"><h1>Analyses</h1></div>${ctl()}<p class="empty">Pas encore de lives sur cette période.</p>`;
  return`<div class="head"><h1>Analyses<br><span>Ce qui marche vraiment.</span></h1></div>${ctl()}<p class="mu" style="margin:14px 0 0">Conversion : abonnés gagnés pour 100 viewers moyens.</p>`+
   tab('Par plateforme',grp(L,l=>P[l.p].n))+tab('Par contenu',grp(L,l=>l.g))+tab('Par jour',grp(L,l=>DJ[wd(l.date)]))+tab('Par créneau',grp(L,l=>SL[slot(l.time)]));
}
function vData(){
  const gi=(p,k,t)=>`<label>${P[p].n} : ${t}<input type="number" min="${k=='t'?1:0}" data-g="${p}.${k}" value="${S.goals[p][k]}"></label>`;
  return`<div class="head"><h1>Données</h1></div>
  <section><h2>Objectifs</h2><div class="set">${gi('twitch','t','objectif')}${gi('twitch','s','abonnés au départ')}${gi('tiktok','t','objectif')}${gi('tiktok','s','abonnés au départ')}</div></section>
  <section><h2>Connexions<small>bientôt</small></h2><div class="set"><label>${dot('twitch')}Twitch<span class="mu">Import automatique des lives</span></label><label>${dot('tiktok')}TikTok<span class="mu">Stats de profil</span></label></div></section>
  <section><h2>Sauvegarde</h2><div class="ctl" style="margin:0"><button class="btn" data-act="expJ">Exporter en JSON</button><button class="btn" data-act="expC">Exporter en CSV</button><button class="btn" data-act="imp">Importer un JSON</button></div></section>
  <section><h2>Zone sensible</h2><div class="ctl" style="margin:0"><button class="btn" data-act="demo">Charger des exemples</button><button class="btn d" data-act="clear">Tout effacer</button></div></section>`;
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v==ui.v));
  $('#main').innerHTML={dash:vDash,lives:vLives,ana:vAna,data:vData}[ui.v]();
}

/* Formulaire */
function openF(l){
  ed=l||null;const f=$('#f');f.reset();$('#fe').textContent='';$('#del').hidden=!l;
  const v=l||{p:ui.plat=='tiktok'?'tiktok':'twitch',date:iso(new Date()),time:new Date().toTimeString().slice(0,5),g:'',d:90,k:0,a:0,s:0,r:0,c:0,note:''};
  Object.keys(v).forEach(k=>{if(f.elements[k])f.elements[k].value=v[k]});$('#dlg').showModal();
}
$('#f').onsubmit=e=>{
  e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),n=k=>Number(String(v[k]).replace(',','.'))||0;
  const o={id:ed?ed.id:uid(),p:v.p,date:v.date,time:v.time,g:v.g.trim().slice(0,60),note:v.note.trim().slice(0,120),d:Math.round(n('d')),k:Math.round(n('k')),a:Math.round(n('a')),s:Math.round(n('s')),r:Math.round(n('r')*100)/100,c:Math.round(n('c'))};
  if(!o.g||o.d<1||[o.k,o.a,o.s,o.r,o.c].some(x=>x<0)||o.a>o.k||new Date(o.date+'T'+o.time)>new Date()){$('#fe').textContent='Vérifie : date passée, durée d’au moins 1 min, moyenne inférieure ou égale au pic.';return}
  S.lives=ed?S.lives.map(x=>x.id==ed.id?o:x):[...S.lives,o];save();$('#dlg').close();render();
};
$('#cancel').onclick=()=>$('#dlg').close();
$('#del').onclick=()=>{if(confirm('Supprimer ce live ? Cette action est définitive.')){S.lives=S.lives.filter(x=>x.id!=ed.id);save();$('#dlg').close();render()}};

/* Actions */
const dl_=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const acts={
  new:()=>openF(),
  expJ:()=>dl_('statik-'+iso(new Date())+'.json',JSON.stringify(S,null,2),'application/json'),
  expC:()=>{const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    dl_('statik-'+iso(new Date())+'.csv','\uFEFF'+['Plateforme;Date;Heure;Contenu;Durée (min);Pic;Moyenne;Abonnés;Revenus;Messages;Note'].concat(S.lives.map(l=>[P[l.p].n,l.date,l.time,l.g,l.d,l.k,l.a,l.s,String(l.r).replace('.',','),l.c,l.note].map(q).join(';'))).join('\r\n'),'text/csv')},
  imp:()=>$('#file').click(),
  demo:()=>{if(S.lives.length&&!confirm('Les exemples remplaceront tes lives actuels. Continuer ?'))return;
    const g=['Valorant','Minecraft','Beatmaking','EA FC 26'];S.lives=Array.from({length:18},(_,i)=>{const a=Math.round(8+i*2.4+(i*7%5));return{id:uid(),p:i%3?'twitch':'tiktok',date:iso(new Date(Date.now()-(40-i*2.2)*864e5)),time:['21:00','15:30','20:30','23:15'][i%4],d:60+(i*17%90),g:g[i%4],k:Math.round(a*1.6),a,s:Math.round(a/4+i%3),r:Math.round(a*(i%4)*3.5)/10,c:a*9,note:''}});save();render()},
  clear:()=>{if(confirm('Tout effacer ? Tes lives seront supprimés définitivement.')){S.lives=[];save();render()}}
};
$('#file').onchange=async e=>{
  try{const d=JSON.parse(await e.target.files[0].text()),ids=new Set(S.lives.map(l=>l.id));
    (d.lives||[]).filter(l=>l&&l.date&&l.time&&l.g&&P[l.p]&&!ids.has(l.id)).forEach(l=>S.lives.push({...l,id:l.id||uid()}));if(d.goals)S.goals={...S.goals,...d.goals};save();render()}
  catch(x){alert('Fichier illisible : choisis un export JSON de Statik.')}e.target.value='';
};
const main=$('#main');
main.onclick=e=>{
  const t=e.target.closest('[data-plat],[data-per],[data-id],[data-sort],[data-act],[data-v]');if(!t)return;const d=t.dataset;e.preventDefault();
  if(d.v){ui.v=d.v}else if(d.plat)ui.plat=d.plat;else if(d.per!=null)ui.per=+d.per;else if(d.sort)ui.sort=[d.sort,ui.sort[0]==d.sort?-ui.sort[1]:-1];
  else if(d.id)return openF(S.lives.find(l=>l.id==d.id));else return acts[d.act]();
  render();
};
main.onkeydown=e=>{if(e.key=='Enter'&&e.target.dataset.id)openF(S.lives.find(l=>l.id==e.target.dataset.id))};
main.onchange=e=>{const g=e.target.dataset.g;if(g){const[p,k]=g.split('.');S.goals[p][k]=Math.max(k=='t'?1:0,Math.round(+e.target.value)||0);save();render()}};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){ui.v=b.dataset.v;render();scrollTo(0,0)}};
$('#q').oninput=e=>{ui.q=e.target.value;if(ui.q&&ui.v!='lives')ui.v='lives';render()};
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();$('#q').focus()}});
$('#af').onsubmit=e=>{e.preventDefault();go(false)};$('#reg').onclick=()=>go(true);
$('#out').onclick=()=>fb.au.signOut(fb.auth);

/* Démarrage */
(async()=>{
  if(CFG.firebase){try{fb=await initFb()}catch(e){fb=null}}
  if(fb){fb.au.onAuthStateChanged(fb.auth,async u=>{
    if(!u){uid_=null;$('#app').hidden=true;$('#auth').hidden=false;return}
    uid_=u.uid;who=(u.email||'').split('@')[0];
    try{const d=await fb.fs.getDoc(fb.fs.doc(fb.db,'users',uid_));if(d.exists())merge(d.data())}catch(e){}
    start();
  })}
  else{try{merge(JSON.parse(localStorage.getItem('statik-v2')))}catch(e){}start()}
})();
</script>
</body>
</html>
